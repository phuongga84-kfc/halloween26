<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100d1b">
  <title>Happy Halloween</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --night: #100d1b;
      --ink: #f8edda;
      --muted: #c2b6c9;
      --orange: #ff9c4a;
      --lilac: #c7a1ff;
      --font: "Fredoka", "Trebuchet MS", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100svh;
      overflow: hidden;
      color: var(--ink);
      background: var(--night);
      font-family: var(--font);
    }
    button { font: inherit; }

    .scene {
      position: fixed;
      inset: 0;
      overflow: hidden;
      isolation: isolate;
      background:
        linear-gradient(180deg, rgba(16, 13, 27, .12), rgba(16, 13, 27, .34)),
        radial-gradient(ellipse at 50% 105%, rgba(72, 39, 76, .48), transparent 52%),
        url("assets/cemetery-desktop.svg") center / cover no-repeat,
        #100d1b;
    }
    .stars, .grain, .horizon { position: absolute; inset: 0; pointer-events: none; }
    .stars {
      opacity: .72;
      background-image:
        radial-gradient(1.5px 1.5px at 7% 21%, #f3d8a8 98%, transparent),
        radial-gradient(1px 1px at 18% 12%, #fff 98%, transparent),
        radial-gradient(1px 1px at 32% 30%, #ddc7e7 98%, transparent),
        radial-gradient(1.5px 1.5px at 43% 11%, #fff 98%, transparent),
        radial-gradient(1px 1px at 65% 18%, #f3d8a8 98%, transparent),
        radial-gradient(1px 1px at 78% 34%, #fff 98%, transparent),
        radial-gradient(1.5px 1.5px at 91% 15%, #ddc7e7 98%, transparent),
        radial-gradient(1px 1px at 84% 56%, #fff 98%, transparent);
    }
    .grain {
      opacity: .14;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E");
    }
    .horizon {
      inset: auto 0 0;
      height: 23vh;
      background: linear-gradient(0deg, rgba(9, 8, 16, .68), transparent);
    }

    .moon {
      position: absolute;
      top: 10%;
      left: 50%;
      width: clamp(112px, 17vw, 218px);
      aspect-ratio: 1;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle at 34% 30%, #fff5d6 0%, #eadab5 48%, #bba9a0 100%);
      box-shadow: 0 0 30px rgba(255, 224, 171, .32), 0 0 105px rgba(255, 205, 145, .16);
      opacity: .94;
    }
    .moon::before, .moon::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: rgba(146, 128, 127, .12);
    }
    .moon::before { width: 18%; height: 18%; top: 25%; left: 21%; }
    .moon::after { width: 11%; height: 11%; right: 25%; bottom: 23%; }
    .cloud {
      position: absolute;
      width: clamp(210px, 34vw, 440px);
      height: 76px;
      border-radius: 50%;
      background: linear-gradient(180deg, rgba(113, 105, 127, .58), rgba(56, 53, 72, .66));
      filter: blur(12px);
      opacity: .76;
      animation: cloud-drift 38s linear infinite;
    }
    .cloud::before, .cloud::after {
      content: "";
      position: absolute;
      bottom: 17px;
      width: 43%;
      height: 85px;
      border-radius: 50%;
      background: inherit;
    }
    .cloud::before { left: 14%; }
    .cloud::after { right: 14%; height: 67px; }
    .cloud-one { top: 26%; left: -20%; }
    .cloud-two { top: 39%; left: 50%; opacity: .48; animation-duration: 52s; animation-direction: reverse; transform: scale(.82); }
    .cloud-three { top: 61%; left: -25%; opacity: .35; animation-duration: 68s; transform: scale(1.05); }
    @keyframes cloud-drift { from { margin-left: -8%; } to { margin-left: 118%; } }

    .web {
      position: absolute;
      top: 0;
      left: 0;
      width: clamp(130px, 22vw, 280px);
      color: rgba(222, 210, 226, .54);
      transition: opacity .9s ease, transform .9s ease;
    }
    .web svg { display: block; width: 100%; height: auto; }
    .spider-string {
      position: absolute;
      top: 0;
      left: 17%;
      width: 1px;
      height: clamp(108px, 22vh, 200px);
      transform-origin: top center;
      background: rgba(235, 225, 236, .7);
      animation: spider-swing 3.8s ease-in-out infinite alternate;
      transition: opacity .6s ease;
    }
    .spider {
      position: absolute;
      left: 50%;
      bottom: -18px;
      width: 39px;
      height: 34px;
      transform: translateX(-50%);
      border-radius: 49% 51% 45% 55%;
      background: #17121d;
      box-shadow: inset -5px -4px 0 rgba(255, 255, 255, .08), 0 4px 8px #08070d;
    }
    .spider::before, .spider::after {
      content: "";
      position: absolute;
      top: 11px;
      width: 20px;
      height: 14px;
      border-top: 2px solid #211b26;
      border-bottom: 2px solid #211b26;
    }
    .spider::before { left: -13px; transform: rotate(-24deg); }
    .spider::after { right: -13px; transform: rotate(24deg); }
    .eyes { position: absolute; top: 10px; left: 12px; z-index: 1; color: #ff9c4a; font-size: 10px; letter-spacing: 2px; }
    @keyframes spider-swing { from { transform: rotate(-7deg); } to { transform: rotate(8deg); } }
    .haunt-layer { position: absolute; z-index: 2; inset: 0; overflow: hidden; pointer-events: none; }
    .ghost {
      position: absolute; top: 41%; right: 12%; width: clamp(72px, 9vw, 126px);
      opacity: .64; filter: blur(.45px) drop-shadow(0 0 16px rgba(215, 203, 255, .35));
    }
    .ghost img { display: block; width: 100%; height: auto; animation: ghost-bob 3.4s ease-in-out infinite alternate; }
    @keyframes ghost-bob { from { translate: 0 7px; rotate: -3deg; } to { translate: 0 -7px; rotate: 3deg; } }
    .grave-pop {
      position: absolute; left: 32%; bottom: 7%; width: clamp(58px, 7vw, 92px);
      opacity: 0; transform: translateY(32px);
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, .5));
      animation: grave-rise 19s ease-in-out 2s infinite;
    }
    .grave-pop svg { width: 100%; display: block; }
    @keyframes grave-rise {
      0%, 32%, 91%, 100% { opacity: 0; transform: translateY(34px); }
      39% { opacity: .95; transform: translateY(-5px); }
      43%, 79% { opacity: 1; transform: translateY(0); }
      84% { opacity: .8; transform: translateY(0); }
    }
    .rolling-pumpkin {
      position: absolute; left: -90px; bottom: 4%; width: clamp(44px, 5.6vw, 70px);
      font-size: clamp(42px, 5.5vw, 66px); line-height: 1;
      filter: drop-shadow(0 0 16px rgba(255, 116, 35, .5));
      animation: pumpkin-roll 17s linear 7s infinite;
    }
    @keyframes pumpkin-roll {
      0% { transform: translateX(-8vw) rotate(-25deg); }
      15% { transform: translateX(16vw) rotate(180deg); }
      30% { transform: translateX(37vw) rotate(360deg); }
      45% { transform: translateX(57vw) rotate(540deg); }
      61% { transform: translateX(77vw) rotate(720deg); }
      78% { transform: translateX(100vw) rotate(900deg); }
      100% { transform: translateX(125vw) rotate(1080deg); }
    }
    .hand-emerge {
      position: absolute; right: 19%; bottom: 7vh; width: clamp(120px, 14vw, 190px);
      height: clamp(140px, 22vh, 230px); opacity: 0;
      transform: translateY(95%); transform-origin: 50% 100%;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, .68));
      animation: hand-emerge 21s ease-in-out 5s infinite;
    }
    .hand-emerge img { display: block; width: 100%; height: 100%; object-fit: contain; animation: hand-sway 1.8s ease-in-out infinite alternate; transform-origin: 50% 100%; }
    .hand-emerge::after {
      content: ""; position: absolute; z-index: -1; left: -35%; bottom: 2px; width: 170%; height: 20px;
      border-radius: 50%; background: radial-gradient(ellipse, rgba(39, 27, 37, .96), rgba(22, 17, 27, .05) 72%);
    }
    @keyframes hand-emerge {
      0%, 33%, 91%, 100% { opacity: 0; transform: translateY(95%); }
      40% { opacity: 1; transform: translateY(25%); }
      46%, 79% { opacity: 1; transform: translateY(0); }
      84% { opacity: .82; transform: translateY(5%); }
    }
    @keyframes hand-sway { from { rotate: -12deg; } to { rotate: 12deg; } }
    .intro {
      position: absolute;
      z-index: 3;
      inset: 0;
      display: grid;
      align-content: center;
      justify-items: center;
      padding: 24px;
      text-align: center;
      transition: opacity .9s ease, transform .9s ease, visibility .9s;
    }
    h1 {
      margin: 0;
      display: grid;
      justify-items: center;
      color: #fff2dc;
      font-family: "Creepster", Impact, fantasy;
      font-size: clamp(64px, 11vw, 112px);
      font-weight: 500;
      letter-spacing: .015em;
      line-height: .92;
      text-shadow: 0 3px 0 #51334d, 0 0 32px rgba(248, 164, 95, .33);
      animation: title-float 4.6s ease-in-out infinite;
    }
    h1 span:first-child { animation: title-glow-cool 3.2s ease-in-out infinite alternate; }
    h1 span:last-child { color: #ff671f; font-size: clamp(46px, 10.3vw, 108px); text-shadow: 0 3px 0 #a92c12, 0 0 34px rgba(255, 89, 23, .44); animation: title-glow-warm 3.2s ease-in-out infinite alternate; }
    @keyframes title-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes title-glow-cool { from { filter: drop-shadow(0 0 4px rgba(217, 255, 164, .28)); } to { filter: drop-shadow(0 0 16px rgba(173, 255, 112, .75)); } }
    @keyframes title-glow-warm { from { filter: drop-shadow(0 0 5px rgba(255, 101, 25, .4)); } to { filter: drop-shadow(0 0 19px rgba(255, 133, 42, .92)); } }
    .intro-bats { margin: 0 0 18px; font-size: clamp(22px, 4vw, 34px); letter-spacing: .42em; }
    .intro-icons { margin: 26px 0 6px; font-size: clamp(26px, 4.5vw, 40px); letter-spacing: .26em; }
    .intro-copy { margin: 4px 0 24px; color: #d7a6ff; font-size: clamp(17px, 2.5vw, 23px); font-weight: 700; letter-spacing: .04em; text-shadow: 0 0 14px rgba(191, 116, 255, .68); }
    .start-button {
      min-height: 50px;
      padding: 0 24px;
      border: 1px solid rgba(255, 203, 151, .6);
      border-radius: 999px;
      color: #241524;
      background: linear-gradient(135deg, #ffd6a3, #ff9c4a);
      box-shadow: 0 0 26px rgba(255, 148, 72, .22);
      cursor: pointer;
      font-size: 14px;
      font-weight: 800;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .start-button:hover { transform: translateY(-2px); box-shadow: 0 0 34px rgba(255, 148, 72, .42); }
    .start-button {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      color: white;
      background: linear-gradient(135deg, #ff812c 0%, #f24618 40%, #b51c20 76%, #73101f 100%);
      background-size: 180% 180%;
      background-position: 0% 50%;
      border-color: rgba(255, 169, 75, .8);
      font-size: 17px;
      letter-spacing: .04em;
      text-transform: uppercase;
      animation: button-blood-glow 4.2s ease-in-out infinite;
    }
    .start-button::before {
      content: "";
      position: absolute;
      z-index: 0;
      inset: 0;
      pointer-events: none;
      opacity: .48;
      background:
        radial-gradient(ellipse at 12% 13%, rgba(91, 0, 14, .82) 0 5px, transparent 7px),
        radial-gradient(ellipse at 88% 25%, rgba(112, 0, 14, .75) 0 9px, transparent 11px),
        radial-gradient(ellipse at 42% 4%, rgba(129, 4, 16, .72) 0 13px, transparent 15px),
        linear-gradient(180deg, rgba(90, 0, 12, .42), transparent 52%);
    }
    .start-button::after {
      content: "";
      position: absolute;
      z-index: 0;
      top: 0;
      left: 0;
      width: 100%;
      height: 58%;
      pointer-events: none;
      opacity: .42;
      background: linear-gradient(180deg, #810817, #a20c1d 52%, rgba(142, 8, 25, .08));
      clip-path: polygon(0 0, 100% 0, 100% 35%, 91% 37%, 89% 82%, 85% 85%, 83% 38%, 69% 42%, 67% 68%, 63% 71%, 61% 40%, 43% 43%, 41% 88%, 37% 91%, 35% 42%, 19% 39%, 17% 66%, 13% 68%, 11% 38%, 0 41%);
    }
    .start-button .button-label, .start-button .button-ghost { position: relative; z-index: 1; }
    @keyframes button-blood-glow {
      0%, 100% { background-position: 0% 50%; box-shadow: 0 0 20px rgba(241, 55, 30, .28), 0 0 30px rgba(112, 0, 18, .12); }
      50% { background-position: 100% 50%; box-shadow: 0 0 28px rgba(255, 95, 38, .46), 0 0 42px rgba(136, 0, 22, .25); }
    }
    .start-button:focus-visible, .candy:focus-visible, .close-button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    .hint {
      position: absolute;
      z-index: 2;
      right: 22px;
      bottom: 18px;
      margin: 0;
      color: rgba(229, 214, 231, .62);
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      pointer-events: none;
    }

    .rain-layer { position: fixed; z-index: 4; inset: 0; overflow: hidden; pointer-events: none; }
    .candy {
      position: absolute;
      top: -90px;
      width: 64px;
      height: 76px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      pointer-events: auto;
      filter: drop-shadow(0 8px 9px rgba(0, 0, 0, .32));
      animation: candy-fall var(--duration, 7s) linear forwards, candy-sway 1.3s ease-in-out infinite alternate;
      animation-delay: 0s, .4s;
      touch-action: manipulation;
    }
    .candy svg { display: block; width: 100%; height: 100%; overflow: visible; }
    @keyframes candy-fall { to { top: calc(100% + 100px); } }
    @keyframes candy-sway { from { margin-left: -8px; rotate: -8deg; } to { margin-left: 8px; rotate: 8deg; } }
    .candy.is-popped { animation: candy-pop .28s ease forwards; pointer-events: none; }
    @keyframes candy-pop { to { opacity: 0; scale: 1.8; filter: blur(5px); } }

    .panel-backdrop, .scare-screen {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(9, 7, 14, .72);
      backdrop-filter: blur(7px);
    }
    [hidden] { display: none !important; }
    .message-card {
      width: min(100%, 410px);
      padding: 34px 28px 28px;
      border: 1px solid rgba(255, 202, 150, .34);
      border-radius: 24px;
      background: linear-gradient(145deg, #30213b, #1c1729 72%);
      box-shadow: 0 24px 90px rgba(0, 0, 0, .45), 0 0 50px rgba(185, 125, 231, .12);
      text-align: center;
      animation: card-in .28s ease-out both;
    }
    @keyframes card-in { from { opacity: 0; transform: translateY(12px) scale(.97); } to { opacity: 1; transform: none; } }
    .message-icon { display: block; margin-bottom: 12px; font-size: 38px; }
    .message-card h2 { margin: 0; font-family: Georgia, serif; font-size: clamp(26px, 7vw, 34px); font-weight: 500; }
    .message-card p { margin: 12px 0 24px; color: #d5c6dc; line-height: 1.6; }
    .close-button {
      min-height: 43px;
      padding: 0 19px;
      border: 1px solid rgba(241, 203, 168, .45);
      border-radius: 999px;
      color: #ffe8cf;
      background: rgba(255, 255, 255, .06);
      cursor: pointer;
    }
    .scare-screen { z-index: 20; padding: 0; background: #000; cursor: pointer; }
    .scare-screen video { width: 100%; height: 100%; object-fit: cover; background: #000; }
    .scare-close-hint {
      position: absolute;
      right: max(16px, env(safe-area-inset-right));
      bottom: max(16px, env(safe-area-inset-bottom));
      padding: 9px 13px;
      border: 1px solid rgba(255, 255, 255, .28);
      border-radius: 999px;
      color: white;
      background: rgba(0, 0, 0, .5);
      font-size: 12px;
      pointer-events: none;
    }

    .scene.is-playing .intro { opacity: 0; transform: translateY(-12px) scale(.98); visibility: hidden; pointer-events: none; }
    .scene.is-playing .web { opacity: 0; transform: translate(-18px, -12px); }
    .scene.is-playing .spider-string { opacity: 0; visibility: hidden; }
    .scene.is-playing .hint { opacity: 0; transition: opacity .5s ease; }
    .scene.is-playing .rain-layer { pointer-events: auto; }

    @media (max-width: 560px) {
      .scene {
        background-image:
          linear-gradient(180deg, rgba(16, 13, 27, .12), rgba(16, 13, 27, .34)),
          radial-gradient(ellipse at 50% 105%, rgba(72, 39, 76, .28), transparent 52%),
          url("assets/cemetery-mobile.svg");
        background-position: center;
        background-size: cover;
      }
      .moon { top: 9%; }
      .cloud-one { top: 25%; }
      .cloud-two { top: 39%; }
      .cloud-three { top: 64%; }
      .ghost { top: 14%; right: 4%; width: clamp(44px, 12vw, 54px); opacity: .56; }
      .hand-emerge { right: 8%; bottom: 7vh; width: 148px; height: 180px; }
      .web { width: 142px; }
      .intro { padding-top: 35px; }
      h1 { font-size: clamp(56px, 16vw, 74px); }
      h1 span:last-child { font-size: clamp(43px, 12.2vw, 58px); }
      .intro-copy { max-width: 300px; line-height: 1.35; }
      .hint { right: 12px; bottom: 12px; font-size: 9px; }
      .candy { width: 58px; height: 70px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
      .cloud, .spider-string, .ghost img, .grave-pop, .rolling-pumpkin, .hand-emerge, .hand-emerge img, h1, h1 span, .start-button { animation-duration: 1ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <main class="scene" id="scene" aria-label="Happy Halloween">
    <div class="stars" aria-hidden="true"></div>
    <div class="moon" aria-hidden="true"></div>
    <div class="cloud cloud-one" aria-hidden="true"></div>
    <div class="cloud cloud-two" aria-hidden="true"></div>
    <div class="cloud cloud-three" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>
    <div class="horizon" aria-hidden="true"></div>

    <div class="web" aria-hidden="true">
      <svg viewBox="0 0 280 240" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 0V240M0 0H280M0 0L280 240M0 0L240 240M0 0L200 240M0 0L160 240M0 0L120 240M0 0L80 240M0 0L40 240M0 40L280 0M0 80L280 0M0 120L280 0M0 160L280 0M0 200L280 0M40 0L0 240M80 0L0 240M120 0L0 240M160 0L0 240M200 0L0 240M240 0L0 240" stroke="currentColor" stroke-width="1.1"/>
        <path d="M0 37L47 39L40 0M0 79L91 81L80 0M0 121L136 123L120 0M0 163L181 165L160 0M0 204L227 207L200 0" stroke="currentColor" stroke-width="1.1"/>
      </svg>
    </div>
    <div class="spider-string" aria-hidden="true"><span class="spider"><span class="eyes">••</span></span></div>
    <div class="haunt-layer" aria-hidden="true">
      <span class="ghost"><img src="assets/ghost.png" alt=""></span>
      <span class="grave-pop">
        <svg viewBox="0 0 100 130" xmlns="http://www.w3.org/2000/svg">
          <path d="M16 121V45C16 22 30 8 50 8s34 14 34 37v76z" fill="#494452" stroke="#918494" stroke-width="4"/>
          <path d="M50 33v37m-16-19h32" stroke="#c4b4c8" stroke-width="5" stroke-linecap="round"/>
          <path d="M7 121h86" stroke="#211a2a" stroke-width="8" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="rolling-pumpkin">🎃</span>
      <span class="hand-emerge">
        <img src="assets/tay.png" alt="">
      </span>
    </div>

    <section class="intro" id="intro">
      <h1><span>HAPPY</span><span>HALLOWEEN</span></h1>
      <p class="intro-icons" aria-hidden="true">🎃　💀　🕷️　👻　🦇</p>
      <p class="intro-copy">Bạn có dám vào không...?</p>
      <button class="start-button" id="startButton" type="button"><span class="button-label">Vào xem nào!</span> <span class="button-ghost" aria-hidden="true">👻</span></button>
    </section>
    <p class="hint" aria-hidden="true">Chạm vào túi kẹo để thử vận may</p>
    <div class="rain-layer" id="rainLayer" aria-label="Mưa túi kẹo"></div>
  </main>

  <section class="panel-backdrop" id="messagePanel" role="dialog" aria-modal="true" aria-labelledby="messageTitle" hidden>
    <div class="message-card">
      <span class="message-icon" aria-hidden="true">🍬</span>
      <h2 id="messageTitle"></h2>
      <p id="messageBody"></p>
      <button class="close-button" id="messageClose" type="button">Tuyệt quá!</button>
    </div>
  </section>

  <section class="scare-screen" id="scareScreen" aria-label="Video Halloween" hidden>
    <video id="scareVideo" playsinline preload="auto"></video>
    <span class="scare-close-hint">Bấm bất cứ đâu để đóng</span>
  </section>

  <script>
    const CONFIG = {
      scareChance: 70, // Phần trăm mỗi lần bấm túi kẹo sẽ bị hù (0–100)
      videos: ["1.mp4", "22.mp4"], 
      safeMessage: {
        title: "Bạn nhận được kẹo!",
        body: "Chúc bạn một Halloween vui vẻ!"
      },
      candyInterval: 520,
      maxCandies: 16
    };

    const scene = document.getElementById("scene");
    const startButton = document.getElementById("startButton");
    const rainLayer = document.getElementById("rainLayer");
    const messagePanel = document.getElementById("messagePanel");
    const messageTitle = document.getElementById("messageTitle");
    const messageBody = document.getElementById("messageBody");
    const messageClose = document.getElementById("messageClose");
    const scareScreen = document.getElementById("scareScreen");
    const scareVideo = document.getElementById("scareVideo");
    let started = false;
    let rainTimer = null;

    const candyArt = `
      <svg viewBox="0 0 72 84" role="presentation" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
        <path d="M26 14 36 5l10 9 11 4-4 10v39l-17 12-17-12V28l-4-10 11-4Z" fill="#d96732" stroke="#ffd18e" stroke-width="2.3" stroke-linejoin="round"/>
        <path d="m26 14 10 5 10-5M19 28l17-4 17 4M19 62l17 5 17-5" fill="none" stroke="#ffbf73" stroke-width="2" opacity=".8"/>
        <path d="M36 25v42" stroke="#7e342e" stroke-width="2" opacity=".7"/>
        <path d="M28 38c2-4 5-4 8 0 3-4 6-4 8 0v8c-2 3-5 3-8 0-3 3-6 3-8 0v-8Z" fill="#251927"/>
        <path d="m31 53 5-2 5 2" fill="none" stroke="#ffd18e" stroke-width="2" stroke-linecap="round"/>
        <circle cx="25" cy="34" r="2" fill="#ffe4b2"/><circle cx="48" cy="54" r="1.7" fill="#ffe4b2"/>
      </svg>`;

    function beginGame() {
      if (started) return;
      started = true;
      scene.classList.add("is-playing");
      rainLayer.setAttribute("aria-hidden", "false");
      spawnCandy();
      rainTimer = window.setInterval(spawnCandy, CONFIG.candyInterval);
    }

    function spawnCandy() {
      if (document.hidden || !started || rainLayer.childElementCount >= CONFIG.maxCandies) return;
      const candy = document.createElement("button");
      const duration = 6.5 + Math.random() * 5.5;
      candy.type = "button";
      candy.className = "candy";
      candy.setAttribute("aria-label", "Bấm để nhặt túi kẹo");
      candy.style.left = `${Math.random() * 92}%`;
      candy.style.setProperty("--duration", `${duration}s`);
      candy.style.animationDuration = `${duration}s, 1.3s`;
      candy.innerHTML = candyArt;
      candy.addEventListener("click", () => chooseCandy(candy), { once: true });
      candy.addEventListener("animationend", (event) => {
        if (event.animationName === "candy-fall") candy.remove();
      });
      rainLayer.appendChild(candy);
    }

    function chooseCandy(candy) {
      if (!started || scareScreen.hidden === false) return;
      candy.classList.add("is-popped");
      window.setTimeout(() => candy.remove(), 300);
      const chance = Math.min(100, Math.max(0, Number(CONFIG.scareChance) || 0));
      if (Math.random() * 100 < chance) playScare();
      else showSafeMessage();
    }

    function showSafeMessage() {
      messageTitle.textContent = CONFIG.safeMessage.title;
      messageBody.textContent = CONFIG.safeMessage.body;
      messagePanel.hidden = false;
      messageClose.focus();
    }

    function closeMessage() {
      messagePanel.hidden = true;
    }

    function playScare() {
      const videos = Array.isArray(CONFIG.videos) ? CONFIG.videos.filter(Boolean) : [];
      if (videos.length === 0) {
        showSafeMessage();
        return;
      }
      const source = videos[Math.floor(Math.random() * videos.length)];
      scareScreen.hidden = false;
      scareVideo.src = source;
      scareVideo.load();
      const playback = scareVideo.play();
      if (playback && typeof playback.catch === "function") playback.catch(() => {});
    }

    function closeScare() {
      if (scareScreen.hidden) return;
      scareVideo.pause();
      scareVideo.removeAttribute("src");
      scareVideo.load();
      scareScreen.hidden = true;
    }

    startButton.addEventListener("click", beginGame);
    messageClose.addEventListener("click", closeMessage);
    messagePanel.addEventListener("click", (event) => {
      if (event.target === messagePanel) closeMessage();
    });
    scareScreen.addEventListener("click", closeScare);
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeScare();
        closeMessage();
      }
    });
  </script>
</body>
</html>
